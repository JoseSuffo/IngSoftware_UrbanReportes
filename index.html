<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Reportes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <main class="app-container">
        <header>
            <h1>Nuevo Urban Reporte</h1>
        </header>
        
        <form id="reportForm" class="report-form">
            <div class="form-group">
                <label for="category">Categoría del Incidente</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="bache">Bache</option>
                    <option value="luminaria">Luminaria</option>
                    <option value="basurero">Basurero</option>
                </select>
            </div>

            <div class="form-group">
                <label for="evidence">Evidencia Fotográfica</label>
                <input type="file" id="evidence" name="evidence" accept="image/*" capture="environment" required>
            </div>

            <div class="preview-container">
                <img id="imagePreview" alt="Vista previa de la foto" style="display: none; max-width: 100%; height: auto;">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit" disabled>Enviar Reporte</button>
        </form>
    </main>

    <script src="app.js" type="module"></script>
</body>
</html>
